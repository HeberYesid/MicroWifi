name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (pruebas, lint y APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
        shell: bash

    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar JDK y SDK de Android
        run: |
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME_17_X64" >> "$GITHUB_PATH"
          JAVA_HOME="$JAVA_HOME_17_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Ejecutar pruebas y lint, y compilar APK de depuración
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Conservar APK de prueba de main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MicroWifi-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Receptor Windows x64 (compilación y protocolo)
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        working-directory: windows
        shell: cmd

    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compilar con MSVC
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          if not defined VS_PATH exit /b 1
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /EHsc /utf-8 /W4 /MT /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 main.cpp /Fe:MicroWifi-video.exe /link /SUBSYSTEM:WINDOWS ws2_32.lib iphlpapi.lib shell32.lib user32.lib ole32.lib uuid.lib || exit /b 1
          cl /nologo /std:c++17 /EHsc /utf-8 /W4 stream_test.cpp /Fe:stream_test.exe || exit /b 1

      - name: Ejecutar prueba del protocolo
        run: stream_test.exe

      - name: Conservar receptor verificado de main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MicroWifi-windows-x64
          path: windows/MicroWifi-video.exe
          if-no-files-found: error
          retention-days: 14
